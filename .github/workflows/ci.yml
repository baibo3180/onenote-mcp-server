name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Kept separate from lint/format so a red build points at the real
      # culprit, and the failing output is echoed as annotations so it stays
      # readable even without access to the raw job log.
      - name: Tests
        run: |
          set +e
          npm test > test-output.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=npm test failed on Node ${{ matrix.node }} (exit $status)::$(grep -E '^# (tests|pass|fail)' test-output.log | tr '\n' ' ')"
            grep -E '^not ok|AssertionError|Error: ' test-output.log | tail -n 40 | while IFS= read -r line; do
              echo "::error title=test detail::$line"
            done
            tail -n 60 test-output.log | while IFS= read -r line; do
              echo "::error title=test output::$line"
            done
            exit "$status"
          fi
          echo "All tests passed on Node ${{ matrix.node }}"
